egar antes para \xABpreparar la caja\xBB. Esa media hora nunca aparece en la n\xF3mina.","trab_32"],["\u{1F4AA}","El Influencer de la Cultura del Esfuerzo","bulo","\xABYo me levanto a las 5 y por eso soy rico\xBB.","Vende cursos sobre productividad. Su capital inicial fue la herencia de pap\xE1.","trab_32"],["\u{1F4CB}","La Delegada que Cuenta Horas","aliado","\xABLo que no se registra, no existe\xBB.","Ha conseguido que su empresa pague las horas extra con un simple registro diario.","trab_32"]]],["Cuando cobras el salario m\xEDnimo",[["\u{1F9F9}","La Kelly","pueblo","\xABHago 25 habitaciones al d\xEDa\xBB.","Limpia hoteles a destajo, con lesiones cr\xF3nicas, en una ciudad cuyo alquiler no puede pagar.","trab_smi"],["\u{1F37E}","El CEO del Bonus","rico","\xABHa sido un a\xF1o dif\xEDcil\xBB (para ti; \xE9l cobra 200 veces m\xE1s).","Congela salarios y se sube el sueldo. Reparte dividendos mientras pide \xABmoderaci\xF3n\xBB.","trab_demo"],["\u{1F4C9}","El Economista del Miedo","bulo","\xAB\xA1Subir el salario m\xEDnimo destruye empleo!\xBB.","Lleva a\xF1os anunciando el apocalipsis con cada subida del salario m\xEDnimo. El empleo sigui\xF3 creciendo.","trab_smi"],["\u{1F379}","El Camarero de Temporada","pueblo","\xABEn verano trabajo 12 horas; en invierno, nada\xBB.","Contratos de tres meses y luego al paro. Planificar una vida as\xED es imposible.","trab_smi"]]]]},{n:"Dinero",e:"\u{1F3E6}",c:"#fff1c2",voto:"Que paguen los que m\xE1s tienen tambi\xE9n se vota. El 29N, Frente Amplio.",s:[["Cuando hablas con tu banco",[["\u{1F3DB}\uFE0F","El Banco Rescatado","rico","\xABGracias por el rescate. Ahora, la comisi\xF3n\xBB.","Se rescat\xF3 a la banca con dinero p\xFAblico; luego llegaron los cierres de oficinas y las comisiones.","banca"],["\u{1F474}","El Abuelo y la App","pueblo","\xABMe cerraron la oficina y no s\xE9 usar el m\xF3vil\xBB.","Tiene que coger un autob\xFAs para ir a un cajero. Lo llaman \xABdigitalizaci\xF3n\xBB.","banca"],["\u{1F4B3}","El Comisionista", s para perseguirlo.","fraude"]]],["Cuando llega una herencia",[["\u{1F451}","El Heredero Millonario","rico","\xABTodo lo que tengo me lo he ganado\u2026 mi abuelo\xBB.","La desigualdad se hereda: las grandes fortunas pasan de generaci\xF3n en generaci\xF3n.","patrim"],["\u{1F480}","El Bulo del Impuesto a la Muerte","bulo","\xAB\xA1Te van a quitar la casa de tu madre!\xBB.","El l\xEDmite propuesto es de 10 millones por heredero: a casi nadie le afecta, pero el miedo se vende bien.","patrim"],["\u{1F3DA}\uFE0F","La Hija que Hered\xF3 un Piso","pueblo","\xABMi madre me dej\xF3 su piso y una hipoteca\xBB.","Hereda deudas y recuerdos. A ella el impuesto a los ultrarricos no le toca un euro.","patrim"],["\u{1F381}","El Bonificador de Sucesiones","politico","\xABBajamos impuestos a todos\xBB (sobre todo a los de arriba).","Bonifica al 99 % las grandes herencias y luego dice que no hay dinero para la sanidad.","patrim"]]]]},{n:"Consumo",e:"\u{1F6D2}",c:"#dff7e8",voto:"El precio del aceite tambi\xE9n es pol\xEDtica. El 29N, vota para que llegues a fin de mes.",s:[["Cuando vas al s\xFAper",[["\u{1F4C8}","La Gran Distribuidora","rico","\xABLa inflaci\xF3n es culpa de la guerra\xBB (y de mis m\xE1rgenes).","Subi\xF3 precios m\xE1s de lo que subieron sus costes y bati\xF3 r\xE9cords de beneficios.","precios"],["\u{1F9D3}","La Jubilada Calculadora","pueblo","\xABHoy no hay fruta, que est\xE1 muy cara\xBB.","Compara precios en tres s\xFApers. Hace tiempo que no compra pescado.","precios"],["\u{1F9D1}\u200D\u{1F33E}","El Agricultor que Cobra Poco","pueblo","\xABMe pagan 20 c\xE9ntimos; t\xFA lo pagas a 2 euros\xBB.","Entre su campo y tu mesa, alguien se queda con casi todo.","agro"],["\u{1F9FA}","La Cooperativa de Consumo","aliado","\xABCompramos juntas, directo al productor\xBB.","Sin intermediarios: mejor precio para quien produce y para quien come.","precios"]]],["Cuando pagas la luz",[["\u{1F50C}","La El\xE9ctrica Insaciable","rico","\xABTu factura sube, mis beneficios tambi\xE9n\xBB.","Cuando el fr\xEDo aprieta, hay hogares que eligen entre calentarse o comer.","energia"],["\u{1F976}","La Familia con Mantas","pueblo","\xABEn invierno, todos a la misma habitaci\xF3n\xBB.","Pobreza energ\xE9tica: no poner la calefacci\xF3n para poder pagar el alquiler.","energia"],["\u2600\uFE0F","La Comunidad Energ\xE9tica","aliado","\xABPusimos placas en el cole y ahora alimentan el barrio\xBB.","Producir energ\xEDa juntas abarata la factura y quita poder a las grandes.","energia"],["\u{1F32B}\uFE0F","El Bulo de \xABLas Renovables Son Caras\xBB","bulo","\xABEl sol no es fiable, mejor el gas\xBB.","Las renovables son hoy la fuente m\xE1s barata de generar electricidad. El bulo protege otros negocios.","energia"]]],["Cuando llenas el dep\xF3sito",[["\u{1F6E2}\uFE0F","La Petrolera","rico","\xABLos precios suben como un cohete y bajan como una pluma\xBB.","R\xE9cords de beneficios mientras t\xFA llenas medio dep\xF3sito.","lujo"],["\u{1F69A}","El Transportista","pueblo","\xABSi sube el gasoil, mi sueldo baja\xBB.","Aut\xF3nomo con un cami\xF3n a medio pagar y m\xE1rgenes cada vez m\xE1s peque\xF1os.","pymes"],["\u{1F6E9}\uFE0F","El Jet Privado","rico","\xABMadrid\u2013Ibiza en 50 minutos. Contaminando como 500 coches\xBB.","Paga menos impuestos por su combustible que t\xFA por el tuyo.","lujo"],["\u{1F686}","La Usuaria del Abono","aliado","\xABDesde que hay abono, me ahorro 80 \u20AC al mes\xBB.","El transporte p\xFAblico barato es la mejor bajada de impuestos para las clases populares.","transp"]]],["Cuando te vas de vacaciones",[["\u{1F6F3}\uFE0F","El Crucero Gigante","rico","\xAB10.000 turistas, 6 horas, cero gasto en la ciudad\xBB.","Contamina, colapsa el centro y deja poco a la econom\xEDa local.","turismo"],["\u{1F6CF}\uFE0F","La Camarera de Piso","pueblo","\xABMis vacaciones son en noviembre, si hay suerte\xBB.","Trabaja cuando todos descansan, por un salario que no le permite viajar.","trab_smi"],["\u{1F3D6}\uFE0F","El Hotelero del \xABTasa No\xBB","patronal","\xABUna tasa tur\xEDstica arruinar\xEDa el sector\xBB.","Reparte beneficios r\xE9cord, pero no quiere que el turismo contribuya a la ciudad que explota.","turismo"],["\u{1F6B2}","La Vecina que Resiste","aliado","\xABEste barrio es para vivir, no un parque tem\xE1tico\xBB.","Organiza al vecindario contra la turistificaci\xF3n y por el derecho a quedarse.","viv_turis"]]]]},{n:"Salud",e:"\u{1FA7A}",c:"#e2f6ff",voto:"La sanidad p\xFAblica se defiende en la calle y se blinda en las urnas. El 29N, Frente Amplio.",s:[["Cuando pides cita en el centro de salud",[["\u{1F9D1}\u{1F3FF}\u200D\u2695\uFE0F","La M\xE9dica de Familia","pueblo","\xABTengo 5 minutos por paciente. As\xED no se cura a nadie\xBB.","Atiende a m\xE1s pacientes de los que puede en una Atenci\xF3n Primaria desbordada.","sanidad"],["\u2702\uFE0F","El Privatizador","politico","\xABLa gesti\xF3n privada es m\xE1s eficiente\xBB.","Cierra centros de salud p\xFAblicos y deriva pacientes a cl\xEDnicas privadas con dinero de todas.","sanidad"],["\u{1F4DE}","El Paciente en Espera","pueblo","\xABLlevo media hora al tel\xE9fono para que me den cita en dos semanas\xBB.","Acaba en urgencias por algo que su m\xE9dica podr\xEDa haber visto a tiempo.","sanidad"],["\u{1F4E3}","La Plataforma Vecinal por la Sanidad","aliado","\xABNos quisieron cerrar el ambulatorio. Sigue abierto\xBB.","Vecinos y sanitarias juntos han frenado cierres y recortes.","sanidad"]]],["Cuando esperas una operaci\xF3n",[["\u{1F4BC}","La Aseguradora Privada","rico","\xAB\xBFCansado de esperar? Hazte un seguro\xBB.","Su negocio crece cada vez que la p\xFAblica empeora.","sanidad"],["\u{1FA7C}","El Se\xF1or de la Lista de Espera","pueblo","\xABMe dijeron seis meses. Va para un a\xF1o\xBB.","Su cadera no puede esperar, pero su cuenta no da para la privada.","sanidad"],["\u{1F9D1}\u200D\u2695\uFE0F","La Enfermera que se Fue","pueblo","\xABMe form\xE9 aqu\xED y trabajo en Inglaterra\xBB.","Espa\xF1a forma enfermeras que luego no puede contratar con condiciones dignas.","empleo_pub"],["\u{1F504}","El Pol\xEDtico de las Derivaciones","politico","\xABNo hay dinero\xBB (para la p\xFAblica; para la privada, s\xED).","Paga a la privada por operaciones que los quir\xF3fanos p\xFAblicos podr\xEDan hacer por las tardes.","sanidad"]]],["Cuando necesitas una psic\xF3loga",[["\u{1F614}","El Chaval con Ansiedad","pueblo","\xABEstoy cansado de todo y no s\xE9 por qu\xE9\xBB.","Esperar meses para ver a una psic\xF3loga en la p\xFAblica no ayuda. No es un fallo personal: es un sistema que aprieta.","smental"],["\u{1F9D8}","El Coach del \xABEs Tu Actitud\xBB","bulo","\xABSi sufres es porque no te esfuerzas en ser feliz\xBB.","Convierte la precariedad en un problema individual y te vende la soluci\xF3n a 99 \u20AC.","smental"],["\u{1F9E0}","La Psic\xF3loga de la P\xFAblica","aliado","\xABNecesitamos m\xE1s compa\xF1eras, no m\xE1s pastillas\xBB.","Tiene 2.000 pacientes asignados. Sabe que la salud mental tambi\xE9n depende del alquiler y el trabajo.","smental"],["\u{1F48A}","La Farmac\xE9utica del Atajo","rico","\xABUna pastilla y a seguir produciendo\xBB.","Gana m\xE1s cuando se medica el malestar que cuando se cambian sus causas.","smental"]]],["Cuando vas al dentista o al oculista",[["\u{1F9B7}","La Cl\xEDnica Dental Low Cost","rico","\xABFinanciamos tu sonrisa a 48 meses\xBB.","Algunas cadenas cerraron dejando a pacientes con tratamientos pagados y a medias.","sanidad"],["\u{1F453}","La Ni\xF1a sin Gafas","pueblo","\xABEn clase no veo la pizarra\xBB.","Sus padres no pueden pagar unas gafas nuevas cada a\xF1o. Sus notas lo notan.","sanidad"],["\u{1F475}\u{1F3FD}","La Abuela de la Dentadura","pueblo","\xABLlevo a\xF1os comiendo solo pur\xE9\xBB.","La salud bucodental no est\xE1 cubierta por la p\xFAblica. Quien no puede pagar, pierde los dientes.","sanidad"],["\u{1F5EF}\uFE0F","El Bulo de \xABLa Privada Funciona Mejor\xBB","bulo","\xABEn la privada te atienden en el d\xEDa\xBB.","Te atienden r\xE1pido porque la p\xFAblica est\xE1 saturada\u2026 a prop\xF3sito.","sanidad"]]]]},{n:"Educaci\xF3n",e:"\u{1F392}",c:"#ffe9d6",voto:"La igualdad de oportunidades empieza en el aula. El 29N, vota educaci\xF3n p\xFAblica.",s:[["Cuando matriculas a tu hija",[["\u{1F469}\u{1F3FE}\u200D\u{1F3EB}","La Profe de la P\xFAblica","pueblo","\xABTengo 29 alumnos. Tres necesitan apoyo y no hay nadie\xBB.","Las ratios altas hacen que la escuela no compense desigualdades: las reproduzca.","educ"],["\u{1F4B0}","La \xABCuota Voluntaria\xBB del Concertado","rico","\xABEs voluntaria, pero si no la pagas\u2026\xBB.","Cobros encubiertos que filtran qui\xE9n entra y qui\xE9n no en centros pagados con dinero p\xFAblico.","educ"],["\u{1F393}","El Pol\xEDtico del Cheque Escolar","politico","\xABLibertad de elecci\xF3n\xBB (para quien puede pagarla).","Desgrava la privada mientras recorta profesorado en la p\xFAblica.","educ"],["\u{1F9C3}","La Madre del AMPA","aliado","\xABConseguimos una profe de apoyo. Ahora vamos a por el comedor\xBB.","Las familias organizadas consiguen recursos que no llegan solos.","educ"]]],["Cuando pides una beca",[["\u{1F4DA}","El Estudiante que Trabaja","pueblo","\xABEstudio por la noche y trabajo de d\xEDa\xBB.","Si suspende una asignatura por cansancio, pierde la beca.","educ"],["\u{1F3EB}","La Universidad Chiringuito","rico","\xABM\xE1ster online, 9.000 \u20AC, t\xEDtulo garantizado\xBB.","Universidades privadas que venden t\xEDtulos con pocos controles de calidad.","educ"],["\u{1F5DE}\uFE0F","El Bulo de \xABBecas para Vagos\xBB","bulo","\xABLas becas se las dan a cualquiera\xBB.","Las becas exigen notas y rentas bajas. El bulo sirve para justificar recortes.","educ"],["\u{1F9D1}\u200D\u{1F3EB}","El Profesor Asociado","pueblo","\xABCobro 400 \u20AC al mes por dar clase en la universidad\xBB.","Ense\xF1a a futuros m\xE9dicos e ingenieros con un contrato precario.","empleo_pub"]]],["Cuando buscas plaza en la guarder\xEDa",[["\u{1F931}","La Madre que Hace Cuentas","pueblo","\xABPa\xF1ales, come
