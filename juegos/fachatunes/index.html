  if(k==='boing'){const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+.5);l.frequency.value=18;lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+.6);l.stop(t+.6)}
  if(k==='whistle'){tone('sine',400,t,.45,.25,1800);tone('sine',1800,t+.45,.3,.2,600)}
  if(k==='bomb'){tone('sine',1900,t,1,.22,260);[0,.02].forEach(d=>{noise(t+1+d,1.4,.9,90);noise(t+1+d,.5,.6,400)});tone('sine',70,t+1,1.2,.9,28);tone('sawtooth',45,t+1,.9,.25,25)}
  if(k==='tab')tone('square',880,t,.05,.08);
  if(k==='drum'){for(let i=0;i<10;i++)noise(t+i*.05,.06,.3,1800)}
  if(k==='alarm'){for(let i=0;i<4;i++){tone('square',880,t+i*.3,.14,.1);tone('square',660,t+i*.3+.15,.14,.1)}}
  if(k==='fanfare'){[[72,0],[76,.12],[79,.24],[84,.4]].forEach(([m,d])=>{tone('square',mf(m),t+d,.35,.12);tone('sawtooth',mf(m-12),t+d,.35,.06)})}}
// «La Internacional» (Pierre De Geyter, 1888, dominio público) en versión MIDI con aire balcánico (bombo-caja «um-pa», acordeón, metales y trinos de clarinete) y guiños de dibujos animados (xilófono y silbato)
const MELS=('A4 3,G#4 1,B4 1,A4 1,E4 1,C#4 1|F#4 4,D4 2,r 1,F#4 1|B4 3,A4 1,G#4 1,F#4 1,E4 1,D4 1|C#4 6,r 1,E4 1|'+
 'A4 3,G#4 1,B4 1,A4 1,E4 1,C#4 1|F#4 4,D4 2,B4 1,A4 1|G#4 2,G#4 1,B4 1,D5 3,G#4 1|A4 6,C#5 1,B4 1|'+
 'G#4 3,G#4 1,F#4 1,G#4 1,A4 1,F#4 1|G#4 4,E4 1,D#4 1,E4 1,F#4 1|F#4 1,F#4 2,F#4 1,B4 3,A4 1|G#4 6,r 1,B4 1|'+
 'B4 3,G#4 1,E4 1,E4 1,D#4 1,E4 1|C#5 4,E4 1,F#4 1,G#4 1,A4 1|G#4 2,B4 2,A4 2,F#4 2|E4 6,C#5 1.5,B4 0.5|'+
 'A4 4,E4 3,F#4 1|F#4 4,D4 2,B4 1.5,A4 0.5|G#4 2,G#4 2,F#4 2,E4 2|E4 6,E4 2|'+
 'C#5 3,C#5 1,B4 2,E4 2|A4 4,G#4 3,G#4 1|F#4 3,F4 1,F#4 2,B4 2|B4 6,C#5 1.5,B4 0.5|'+
 'A4 4,E4 3,F#4 1|F#4 4,D4 2,B4 1.5,A4 0.5|G#4 2,G#4 2,G#4 3,E4 1|C#5 6,r 1,C#5 1|'+
 'E5 3,E5 1,D5 2,C#5 2|B4 2,C#5 2,D5 2,r 1,D5 1|C#5 3,C#5 1,B4 3,A4 1|A4 6,r 1,E4 1');
const NM={C:0,D:2,E:4,F:5,G:7,A:9,B:11},nm=x=>{const m=x.match(/^([A-G])(#?)(\d)$/);return 12*(+m[3]+1)+NM[m[1]]+(m[2]?1:0)};
const ROOTS=['A2','D3','B2','A2','A2','D3','E2','A2','E2','E2','B2','E2','E2','A2','E2','E2','A2','D3','E2','A2','A2','F#2','B2','E2','A2','D3','E2','A2','F#2','B2','A2','A2'].map(nm),QUAL='MMmMMMMMMMMMMMMMMMMMMmmMMMMMMmMM';
const STEPS=[];MELS.split('|').forEach(bar=>bar.split(',').forEach(ev=>{const [n,l]=ev.trim().split(' '),len=Math.round(+l*2);STEPS.push(n==='r'?null:{m:nm(n),len});for(let i=1;i<len;i++)STEPS.push(undefined)}));
function saw(m,t,d,v,det=0,cut=2400){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=det;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.setValueAtTime(v,t+Math.max(.02,d*.75));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
const BELLA=('r 5,D4 1,G4 1,A4 1|A#4 1,G4 4,D4 1,G4 1,A4 1|A#4 1,G4 4,D4 1,G4 1,A4 1|A#4 2,A4 1,G4 1,A#4 2,A4 1,G4 1|D5 2,D5 2,D5 1,D5 1,C5 1,D5 1|'+
 'D#5 1,D#5 4,D#5 1,D5 1,C5 1|D#5 1,D5 4,D5 1,C5 1,A#4 1|A4 2,D5 2,A#4 2,A4 2|G4 8');
const BSTEPS=[];BELLA.split('|').forEach(bar=>bar.split(',').forEach(ev=>{const [n,l]=ev.trim().split(' '),len=Math.round(+l*2);BSTEPS.push(n==='r'?null:{m:nm(n),len});for(let i=1;i<len;i++)BSTEPS.push(undefined)}));
// «Bella ciao» (canción popular italiana, dominio público) y «La Internacional» (De Geyter, 1888)
const SONGS={bella:{st:BSTEPS,R:['G2','G2','G2','G2','D3','C3','G2','D3','G2'].map(nm),Q:'mmmmMmmMm',bpm:152,cumbia:1},
 inter:{st:STEPS,R:ROOTS,Q:QUAL,bpm:168,cumbia:0}};let curS='';
function startMusic(){if(musicOn||muted)return;musicOn=true;nextT=AC.currentTime+.05;step=0;timer=setInterval(()=>{while(nextT<AC.currentTime+.15){
    const sn=$('title').classList.contains('on')?'bella':'inter';if(sn!==curS){curS=sn;step=0}const SG=SONGS[sn];
    const sd=60/SG.bpm/4,N=SG.st.length,s2=step%N,bar=(s2>>4)%SG.R.length,b=s2&15,root=SG.R[bar],ch=[root,root+(SG.Q[bar]==='m'?3:4),root+7];
    if(SG.cumbia){noise(nextT,b%2?.03:.05,b%4===2?.22:.12,7000);if(b===0||b===8)tone('sine',110,nextT,.18,.5,45);if(b===4||b===12)noise(nextT,.08,.3,1800);
      if(b===0||b===8)saw(root-12,nextT,sd*3,.13,0,700);if(b===6||b===14)saw(root-5,nextT,sd*1.8,.11,0,700);if(b%4===2)ch.forEach(m=>saw(m+12,nextT,sd*.7,.03,0,1800))}
    else{if(b%4===0){tone('sine',110,nextT,.18,.55,45);noise(nextT,.05,.2,180)}if(b%4===2){noise(nextT,.07,.28,2200);ch.forEach(m=>saw(m+12,nextT,sd*1.6,.035,0,1800))}
      if(b%8===6)noise(nextT,.03,.15,5000);if(b===14||b===15)noise(nextT,.04,.12,3500);if(b%8===0)saw(root-12,nextT,sd*3,.12,0,700);if(b%8===4)saw(root-5,nextT,sd*3,.1,0,700)}
    const n=SG.st[s2];if(n){const d=sd*n.len;saw(n.m,nextT,d*.9,.06,-8,2600);saw(n.m,nextT,d*.9,.05,8,2600);tone('sine',mf(n.m+24),nextT,.12,.06);
      if(n.len>=6)for(let k=2;k<n.len;k+=1)tone('triangle',mf(n.m+12+(k%2?2:0)),nextT+k*sd,sd*.9,.035)}
    if(b===0&&bar%8===7)tone('sine',500,nextT,sd*14,.07,1600);
    nextT+=sd;step++}},40)}
// la portada suena en cuanto se toca la pantalla (los navegadores no dejan sonar antes)
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{try{initAudio();startMusic()}catch(e){}},{once:true,capture:true}));
function stopMusic(){musicOn=false;clearInterval(timer)}
if($('snd'))$('snd').onclick=()=>{initAudio();muted=!muted;$('snd').textContent=muted?'🔇':'🔊';if(muted)stopMusic();else startMusic()};

// frases que van pasando en la portada, en orden aleatorio
const PHR=['Descubre el facha que llevas dentro y sabrás a quién votar este 29N.','Ser facha es culpar al vecino que viene de fuera y aplaudir al banquero que se queda tu sueldo.','Ser facha es echar de menos una mili que ni hiciste.','Ser facha es decir «yo no soy racista, pero…».','Ser facha es querer mano dura para el de abajo y perdón fiscal para el de arriba.','Ser facha es creerse el bulo antes que el dato.','Ser facha es pensar que el NO-DO era periodismo.','Nadie nace facha: se tunea. Y se destunea.','Cambiar de chaqueta está mal visto. Cambiar de facha a persona, no.','Del bigote al palestino solo hay un voto de distancia.','Este 29N quítate el fachaleco y ponte el chándal.','Este 29 de noviembre, tunéate bien y vota mejor.','El 29N no votes disfrazado: vota lo que te conviene a ti, no al de arriba.','Alquiler con tope: nunca más del 25% de lo que entra en casa.','32 horas a la semana cobrando lo mismo. El facha prefiere fichar los sábados.','Abono único de transporte: 20 € al mes. Con menos de 26, 10 €. Con menos de 16, gratis.','200 € al mes por cada hijo o hija, cobres lo que cobres.','Comedor escolar gratis en la pública. El facha prefiere el bocata con banderita.','1,5 millones de viviendas públicas. El fondo buitre, a buscarse otro nido.','Pisos turísticos fuera de los barrios tensionados en 3 años. Tu barrio no es un hotel.','Fortunas de más de 50 millones: un 3% al año. Si eres currela, tranquilo, no te toca.','Pensión mínima igual al salario mínimo. Los abuelos no se tunean: se respetan.','Gafas y lentillas gratis, para ver de una vez el bulo.','20 semanas de permiso por nacimiento para cada progenitor. Criar no es cosa de una.','Las grandes empresas, al menos un 20% real de impuestos. Tú ya pagas más.','Médico y escuela a menos de 30 minutos, también en los pueblos.','Pañales con IVA superreducido; jets y yates, con recargo. Así de fácil.'];
let phrQ=[];setInterval(()=>{if(!$('title').classList.contains('on'))return;if(!phrQ.length)phrQ=PHR.slice().sort(()=>Math.random()-.5);const el=$('phr');el.style.setProperty('--r',(Math.random()*10-5).toFixed(1)+'deg');el.textContent=phrQ.shift();el.style.fontSize=el.textContent.length>78?'24px':'';el.classList.remove('stamp');void el.offsetWidth;el.classList.add('stamp');if(AC&&!muted){const t=AC.currentTime+.2;tone('sine',95,t,.25,.8,35);noise(t,.12,.5,500)}},3600);
ui();requestAnimationFrame(loop);
}
